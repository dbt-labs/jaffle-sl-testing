models:
  - name: orders
    description: Order overview data mart with one row per order, including order value, tax, item-type flags, and fulfillment cost.
    columns:
      - name: order_id
        description: The unique key of the orders mart.
        tests:
          - not_null
          - unique
      - name: customer_id
        description: The foreign key for the customer who placed the order.
        tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: location_id
        description: The foreign key for the store where the order was placed.
      - name: order_total
        description: The total amount of the order in USD, including tax.
      - name: tax_paid
        description: The tax paid for the order in USD.
      - name: ordered_at
        description: The timestamp when the order was placed.
      - name: is_food_order
        description: True when the order contains at least one food item.
      - name: is_drink_order
        description: True when the order contains at least one drink item.
      - name: order_cost
        description: The sum of supply costs associated with fulfilling the order.
semantic_models:
  #The name of the semantic model.
  - name: orders
    defaults:
      agg_time_dimension: ordered_at
    description: |
      Order fact table. This table is at the order grain with one row per order. 
    #The name of the dbt model and schema
    model: ref('orders')
    #Entities. These usually corespond to keys in the table.
    entities:
      - name: order_id
        type: primary
      - name: location
        type: foreign
        expr: location_id
      - name: customer
        type: foreign
        expr: customer_id
    #Measures. These are the aggregations on the columns in the table.
    measures: 
      - name: order_total
        description: The total revenue for each order.
        agg: sum
      - name: order_count
        expr: 1
        agg: sum
      - name: tax_paid
        description: The toal tax paid on each order. 
        agg: sum
      - name: customers_with_orders
        description: Distinct count of customers placing orders
        agg: count_distinct
        expr: customer_id
      - name: locations_with_orders
        description: Distinct count of locations with order
        expr: location_id
        agg: count_distinct
      - name: order_cost
        description: The cost for each order item. Cost is calculated as a sum of the supply cost for each order item. 
        agg: sum
    #Dimensions. Either categorical or time. These add additonal context to metrics. The typical querying pattern is Metric by Dimension.  
    dimensions:
      - name: ordered_at
        type: time
        type_params:
          time_granularity: day
      - name: ordered_at_date
        type: time
        expr: date_trunc('day', ordered_at)::DATE
        type_params:
          time_granularity: day
      - name: order_total_dim
        type: categorical
        expr: order_total
      - name: is_food_order
        type: categorical
      - name: is_drink_order
        type: categorical  
metrics:
  - name: order_total
    description: Sum of total order amonunt. Includes tax + revenue.
    type: simple
    label: Order Total
    type_params:
      measure: order_total