models:
  - name: orders
    description: Order overview mart with one row per order.
    columns:
      - name: order_id
        description: The unique key of the orders mart.
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: The foreign key relating to the customer who placed the order.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: location_id
        description: The foreign key relating to the location where the order was placed.
      - name: order_total
        description: The total amount of the order in USD including tax.
      - name: tax_paid
        description: The amount of tax paid for the order in USD.
      - name: ordered_at
        description: The timestamp the order was placed.
      - name: order_cost
        description: The summed supply cost associated with the ordered products.
      - name: is_food_order
        description: Whether the order included any food items.
      - name: is_drink_order
        description: Whether the order included any drink items.

semantic_models:
  - name: orders
    defaults:
      agg_time_dimension: ordered_at
    description: |
      Order fact table. This table is at the order grain with one row per order.
    model: ref('orders')
    entities:
      - name: order_id
        type: primary
      - name: location
        type: foreign
        expr: location_id
      - name: customer
        type: foreign
        expr: customer_id
    measures:
      - name: order_total
        description: The total revenue for each order.
        agg: sum
      - name: order_count
        expr: 1
        agg: sum
      - name: tax_paid
        description: The total tax paid on each order.
        agg: sum
      - name: customers_with_orders
        description: Distinct count of customers placing orders.
        agg: count_distinct
        expr: customer_id
      - name: locations_with_orders
        description: Distinct count of locations with orders.
        expr: location_id
        agg: count_distinct
      - name: order_cost
        description: The summed supply cost associated with the ordered products in an order.
        agg: sum
    dimensions:
      - name: ordered_at
        type: time
        type_params:
          time_granularity: day
      - name: order_total_dim
        type: categorical
        expr: order_total
      - name: is_food_order
        type: categorical
      - name: is_drink_order
        type: categorical

metrics:
  - name: order_total
    description: Sum of total order amount. Includes tax and revenue.
    type: simple
    label: Order Total
    type_params:
      measure: order_total
