models:
  - name: customers
    config:
      static_analysis: strict
    description: Customer overview data mart, offering key details for each unique customer. One row per customer, including customers who have not ordered.
    columns:
      - name: customer_id
        description: The unique key of the customers mart.
        tests:
          - not_null
          - unique
      - name: customer_name
        description: The customer's full name.
      - name: count_lifetime_orders
        description: Total number of orders the customer has placed; null when the customer has never ordered.
      - name: first_ordered_at
        description: The timestamp when the customer placed their first order; null when the customer has never ordered.
      - name: last_ordered_at
        description: The timestamp when the customer placed their most recent order; null when the customer has never ordered.
      - name: lifetime_spend_pretax
        description: The sum of item subtotals, excluding tax, across all of the customer's orders.
      - name: lifetime_spend
        description: The sum of order totals, including tax, across all of the customer's orders. Each order total is counted once.
      - name: customer_type
        description: The customer's purchase-frequency segment. Values are `no orders`, `new` (exactly one order), and `returning` (more than one order).
        tests:
          - accepted_values:
              arguments:
                values: ["no orders", "new", "returning"]
metrics:
  - name: customers_with_orders
    description: Distinct count of customers who have placed at least one order.
    type: simple
    label: Customers w/ Orders
    type_params:
      measure: customers_with_orders
  - name: new_customer
    description: Distinct count of customers who have placed exactly one order.
    label: New Customers
    type: simple
    type_params:
      measure: customers_with_orders
    filter: |
      {{ Dimension('customer__customer_type') }} = 'new'
  - name: returning_customers
    description: Distinct count of customers who have placed more than one order.
    label: Returning Customers
    type: simple
    type_params:
      measure: customers_with_orders
    filter: |
      {{ Dimension('customer__customer_type') }} = 'returning'
  - name: repeat_purchase_rate
    description: The share of customers with at least one order who have placed more than one lifetime order. Without a time filter this is an all-time rate; an order-time filter changes the active-customer cohort but the returning classification remains lifetime-based.
    label: Repeat Purchase Rate
    type: ratio
    type_params:
      numerator: returning_customers
      denominator: customers_with_orders
  - name: customer_lifetime_value
    description: Sum of customer lifetime spend including tax. Group by customer to return each customer's lifetime value.
    label: Customer Lifetime Value
    type: simple
    type_params:
      measure: customer_lifetime_value
