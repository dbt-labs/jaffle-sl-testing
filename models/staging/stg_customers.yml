---
semantic_models:
  - name: stg_customers
    defaults:
      agg_time_dimension: first_ordered_at
    description: >
      Customer dimension at one row per customer, including governed repeat
      purchase and 90-day inactivity churn attributes.
    model: ref('customers')
    entities:
      - name: customer
        type: primary
        expr: customer_id
        config:
          meta:
            contains_pii: false
    measures:
      - name: customer_count
        description: Distinct count of customers.
        agg: count_distinct
        expr: customer_id
      - name: customer_lifetime_value
        description: Customer lifetime spend including tax, in USD.
        agg: sum
        expr: lifetime_spend
    dimensions:
      - name: customer_name
        type: categorical
        config:
          meta:
            contains_pii: true
      - name: count_lifetime_orders
        type: categorical
      - name: lifetime_spend
        type: categorical
      - name: customer_type
        type: categorical
      - name: is_repeat_buyer
        type: categorical
      - name: customer_status
        type: categorical
      - name: first_ordered_at
        type: time
        type_params:
          time_granularity: day
      - name: last_ordered_at
        type: time
        type_params:
          time_granularity: day
      - name: churned_at
        type: time
        type_params:
          time_granularity: day
      - name: data_as_of_at
        type: time
        type_params:
          time_granularity: day
