---
semantic_models:
  #The name of the semantic model.
  - name: stg_customers
    defaults:
      agg_time_dimension: first_ordered_at
    description: |
      Customer dimension table. The grain of the table is one row per customer.
    #The name of the dbt model
    model: ref('customers')
    #Entities. These usually corespond to keys in the table.
    entities:
      - name: customer
        type: primary
        expr: customer_id
        config:
          meta:
            contains_pii: false
    #Dimensions. Either categorical or time. These add additonal context to metrics. The typical querying pattern is Metric by Dimension.
    dimensions:
      - name: customer_name
        type: categorical
        config:
          meta:
            contains_pii: true
      - name: count_lifetime_orders
        type: categorical
      - name: lifetime_spend
        type: categorical
      - name: is_repeat_buyer
        type: categorical
      - name: customer_type
        type: categorical
      - name: is_churned
        type: categorical
      - name: first_ordered_at
        type: time
        type_params:
          time_granularity: day
      - name: last_ordered_at
        type: time
        type_params:
          time_granularity: day
      - name: churned_at
        description: Timestamp when the customer reaches 90 days of inactivity.
        type: time
        type_params:
          time_granularity: day
      - name: data_as_of_at
        description: Latest order timestamp used to evaluate churn.
        type: time
        type_params:
          time_granularity: day
