version: 2

semantic_models:
  - name: stg_locations
    description: Location dimension table at one row per store location.
    model: ref('stg_locations')
    entities:
      - name: location
        type: primary
        expr: location_id
    dimensions:
      - name: location_name
        type: categorical
      - name: region
        type: categorical
      - name: tax_rate
        type: categorical
      - name: opened_at
        type: time
        type_params:
          time_granularity: day

metrics:
  - name: locations
    description: Distinct count of locations with orders.
    type: simple
    label: Locations
    type_params:
      measure: locations_with_orders