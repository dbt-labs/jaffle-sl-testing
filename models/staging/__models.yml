version: 2

models:
  - name: stg_customers
    description: Customer data with basic cleaning and transformation applied, one row per customer.
    columns:
      - name: customer_id
        description: The unique key for each customer.
        tests:
          - not_null
          - unique

  - name: stg_locations
    description: "List of open locations with basic cleaning and transformation applied, one row per location. Location dimension table. The grain of the table is one row per location. \n"
    columns:
      - name: location_id
        description: The unique key for each location.
        tests:
          - not_null
          - unique

        entity:
          type: primary
          name: location
      - name: location_name
        dimension:
          type: categorical
      - name: tax_rate
        dimension:
          type: categorical
      - name: opened_at
        dimension:
          type: categorical
    semantic_model:
      enabled: true
  - name: stg_order_items
    description: Individual food and drink items that make up our orders, one row per item.
    columns:
      - name: order_item_id
        description: The unique key for each order item.
        tests:
          - not_null
          - unique

  - name: stg_orders
    description: Order data with basic cleaning and transformation applied, one row per order.
    columns:
      - name: order_id
        description: The unique key for each order.
        tests:
          - not_null
          - unique

  - name: stg_products
    description: "Product (food and drink items that can be ordered) data with basic cleaning and transformation applied, one row per product. Product dimension table. The grain of the table is one row per product. \n"
    columns:
      - name: product_id
        description: The unique key for each product.
        tests:
          - not_null
          - unique

        entity:
          type: primary
          name: product
      - name: product_name
        dimension:
          type: categorical
      - name: product_type
        dimension:
          type: categorical
      - name: product_description
        dimension:
          type: categorical
      - name: is_food_item
        dimension:
          type: categorical
      - name: is_drink_item
        dimension:
          type: categorical
      - name: product_price
        dimension:
          type: categorical
    semantic_model:
      enabled: true
  - name: stg_supplies
    description: >
      List of our supply expenses data with basic cleaning and transformation applied.

      One row per supply cost, not per supply. As supply costs fluctuate they receive a new row with a new UUID. Thus there can be multiple rows per supply_id.
    columns:
      - name: supply_uuid
        description: The unique key of our supplies per cost.
        tests:
          - not_null
          - unique